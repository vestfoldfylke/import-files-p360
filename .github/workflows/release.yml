name: Run tests and build runnable script files, and release them

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  call-security:
    uses: vestfoldfylke/shared/.github/workflows/npm-security.yml@main
    with:
      audit_severity: "moderate"

  release:
    needs: call-security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Read version from package.json
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        run: |
          if gh release view "${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.pkg.outputs.version }} already exists — bump the version in package.json." >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package dist
        run: zip -r "${{ github.event.repository.name }}-${{ steps.pkg.outputs.version }}.zip" dist

      - name: Create release with asset
        run: |
          gh release create "${{ steps.pkg.outputs.version }}" \
            "${{ github.event.repository.name }}-${{ steps.pkg.outputs.version }}.zip" \
            --target "${{ github.sha }}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}